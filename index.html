<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vokabeltest Pro</title>
    <script src="tailwind.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body class="p-4">
    <div id="app" class="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        <!-- Header -->
        <div class="bg-blue-600 p-4 text-white text-center relative">
            <h1 class="text-xl font-bold">Vokabeltest Pro</h1>
            <p id="mode-indicator" class="text-blue-100 text-xs">Lade Daten...</p>
            <div id="score-display" class="hidden absolute top-4 right-4 font-mono font-bold bg-blue-700 px-3 py-1 rounded-full text-xs">0 / 0</div>
        </div>

        <!-- Cookie (Katzen-Bereich) -->
        <div id="cat-container" class="relative bg-gradient-to-b from-orange-50 to-amber-100 border-b border-orange-200 p-4 flex items-center justify-center gap-6 overflow-hidden">
            <div id="food-spawn-point" class="absolute inset-0 pointer-events-none"></div>

            <div class="relative flex flex-col items-center cursor-pointer" onclick="petCat()">
                <div id="cat-sprite" class="cookie-sleeping"></div>
                <div id="cat-bubble" class="hidden absolute -top-7 bg-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow border border-orange-200 text-orange-600 animate-bounce">
                    *Schnurr*
                </div>
            </div>

            <div class="flex-1 max-w-[160px]">
                <div class="flex justify-between text-[11px] font-bold text-orange-800 mb-1">
                    <span>Cookie</span>
                    <span id="cat-level">Lvl 1</span>
                </div>
                <div class="w-full bg-orange-200/70 rounded-full h-3 p-0.5 shadow-inner">
                    <div id="cat-energy-bar" class="bg-gradient-to-r from-orange-400 to-amber-500 h-full rounded-full transition-all duration-500" style="width: 50%"></div>
                </div>
                <p id="cat-status" class="text-[10px] font-bold text-orange-600 mt-1 uppercase text-center tracking-wider">Cookie schläft...</p>
            </div>
        </div>

        <!-- Start-Screen -->
        <div id="start-screen" class="p-8 space-y-4">
            <div class="grid grid-cols-2 gap-2">
                <button onclick="openPrintModal()" class="w-full bg-slate-100 text-slate-600 p-3 rounded-xl font-bold text-xs border hover:bg-slate-200 transition">
                    <i class="fas fa-print mr-1"></i>Drucken
                </button>
                <button onclick="openAdminModal()" class="w-full bg-slate-100 text-slate-600 p-3 rounded-xl font-bold text-xs border hover:bg-slate-200 transition">
                    <i class="fas fa-plus-circle text-blue-600 mr-1"></i>Vokabel +
                </button>
            </div>

            <!-- Sprache & Klasse -->
            <div class="grid grid-cols-2 gap-3 pt-2">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Sprache:</label>
                    <select id="lang-select" onchange="updateClassAndPageFilters()" class="w-full p-3 border-2 border-slate-100 rounded-xl bg-white outline-none focus:border-blue-500 text-sm font-semibold"></select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Klasse:</label>
                    <select id="class-select" onchange="updatePageFilterOnly()" class="w-full p-3 border-2 border-slate-100 rounded-xl bg-white outline-none focus:border-blue-500 text-sm font-semibold"></select>
                </div>
            </div>

            <!-- Seite wählen -->
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Seite wählen:</label>
                <select id="page-select" class="w-full p-3 border-2 border-slate-100 rounded-xl bg-white outline-none focus:border-blue-500 text-sm font-semibold"></select>
            </div>

            <!-- Mix-Modus -->
            <div class="flex items-center justify-between p-3 bg-slate-50 rounded-xl border">
                <span class="text-xs font-bold text-slate-600 uppercase">Mix-Modus (DE / Fremdspr.)</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="mix-mode-toggle" class="sr-only peer">
                    <div class="w-9 h-5 bg-gray-200 rounded-full peer peer-checked:bg-blue-600 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:after:translate-x-full"></div>
                </label>
            </div>

            <div class="space-y-2 pt-2">
                <button id="btn-all" onclick="setupGame('all')" disabled class="w-full bg-slate-300 text-white p-4 rounded-xl font-bold transition shadow-md active:scale-95">Start</button>
            </div>
        </div>

        <!-- Game-Screen -->
        <div id="game-screen" class="p-8 hidden">
            <div class="w-full bg-gray-100 rounded-full h-1.5 mb-6"><div id="progress-bar" class="bg-blue-600 h-1.5 rounded-full transition-all duration-300"></div></div>
            <div class="text-center mb-6">
                <p id="dir-label" class="text-gray-400 uppercase text-[10px] font-bold mb-1">Übersetze...</p>
                <h2 id="q-text" class="text-3xl font-black text-slate-800">...</h2>
                <div id="hint-area" class="hidden mt-4">
                    <button onclick="toggleHint()" id="h-btn" class="text-blue-500 text-[10px] font-bold uppercase"><i class="fas fa-lightbulb mr-1"></i>Tipp</button>
                    <div id="h-box" class="hidden mt-2 p-3 bg-amber-50 border border-amber-100 rounded-xl text-xs italic text-amber-800 text-left"></div>
                </div>
            </div>
            <input type="text" id="user-input" class="w-full px-4 py-4 text-xl border-2 border-slate-100 rounded-2xl focus:border-blue-500 outline-none text-center mb-6 shadow-sm" placeholder="Antwort..." autocomplete="off" autocapitalize="none" autocorrect="off">
            <div id="feedback-area" class="hidden mb-6 p-4 rounded-xl text-center text-sm border-2">
                <p id="feedback-text" class="font-bold"></p>
                <p id="correct-display" class="mt-1 text-slate-600 hidden">Lösung: <span class="font-bold"></span></p>
            </div>
            <button id="check-btn" onclick="checkAnswer()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition">Prüfen</button>
            <button id="next-btn" onclick="nextQuestion()" class="hidden w-full bg-slate-800 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition">Weiter</button>
        </div>

        <!-- Result-Screen -->
        <div id="result-screen" class="hidden p-8 overflow-y-auto max-h-[80vh]">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold">Fertig!</h2>
                <div class="text-5xl font-black text-blue-600 my-2" id="res-pct">0%</div>
            </div>
            <div id="history-list" class="space-y-2 mb-6"></div>
            <button onclick="location.reload()" class="w-full bg-slate-800 text-white font-bold py-4 rounded-2xl">Menü</button>
        </div>

        <!-- Print-Modal -->
        <div id="print-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl">
                <h3 class="font-bold mb-4 text-lg"><i class="fas fa-print text-blue-500 mr-2"></i>Drucken</h3>
                <div class="mb-4">
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Seite (aktuell gewählte Sprache/Klasse):</label>
                    <select id="print-page-select" class="w-full border rounded-xl p-2 text-sm mt-1"></select>
                </div>
                <div class="space-y-2">
                    <button onclick="generatePrint('all')" class="w-full p-3 text-left border rounded-xl hover:bg-blue-50 font-bold text-sm">Übersichtsliste (keine Lösungen)</button>
                    <button onclick="generatePrint('ger')" class="w-full p-3 text-left border rounded-xl hover:bg-blue-50 font-bold text-sm">Test: Nur Fremdsprache vorgegeben</button>
                    <button onclick="generatePrint('eng')" class="w-full p-3 text-left border rounded-xl hover:bg-blue-50 font-bold text-sm">Test: Nur Deutsch vorgegeben</button>
                    <button onclick="generatePrint('random')" class="w-full p-3 text-left border rounded-xl hover:bg-blue-50 font-bold text-sm">Test: Zufallsmix</button>
                </div>
                <button onclick="closePrintModal()" class="w-full mt-4 text-slate-400 text-xs uppercase font-bold">Abbrechen</button>
            </div>
        </div>

        <!-- Admin-Modal -->
        <div id="admin-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl space-y-3">
                <h3 class="font-bold text-lg text-slate-800"><i class="fas fa-edit text-blue-600 mr-2"></i>Neue Vokabel</h3>
                
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Sprache:</label>
                        <input type="text" id="adm-lang" value="Englisch" class="w-full border-2 border-slate-100 rounded-xl p-2 text-sm outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Klasse:</label>
                        <input type="text" id="adm-grade" value="6" class="w-full border-2 border-slate-100 rounded-xl p-2 text-sm outline-none focus:border-blue-500">
                    </div>
                </div>

                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Fremdsprache (Englisch / Französisch):</label>
                    <input type="text" id="adm-foreign" placeholder="z.B. apple / la pomme" class="w-full border-2 border-slate-100 rounded-xl p-2.5 text-sm outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Deutsch:</label>
                    <input type="text" id="adm-ger" placeholder="z.B. Apfel" class="w-full border-2 border-slate-100 rounded-xl p-2.5 text-sm outline-none focus:border-blue-500">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Seite:</label>
                        <input type="text" id="adm-page" placeholder="z.B. 204" class="w-full border-2 border-slate-100 rounded-xl p-2 text-sm outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Tipp (optional):</label>
                        <input type="text" id="adm-hint" placeholder="Eselsbrücke..." class="w-full border-2 border-slate-100 rounded-xl p-2 text-sm outline-none focus:border-blue-500">
                    </div>
                </div>

                <label class="flex items-center gap-2 text-xs text-slate-600 pt-1 cursor-pointer">
                    <input type="checkbox" id="adm-instant" class="rounded text-blue-600">
                    <span>Tipp sofort ohne Klick anzeigen</span>
                </label>

                <p id="adm-status" class="text-xs font-bold text-center hidden"></p>

                <button id="adm-save-btn" onclick="saveNewVocab()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-md active:scale-95 transition">
                    Speichern
                </button>
                <button onclick="closeAdminModal()" class="w-full text-slate-400 text-xs uppercase font-bold pt-1">Schließen</button>
            </div>
        </div>
    </div>

    <!-- Ausgelagerte Skripte in exakter Reihenfolge -->
    <script src="js/cat.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
